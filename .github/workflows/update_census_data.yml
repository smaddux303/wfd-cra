name: Update Census Data

on:
  schedule:
    - cron: '0 9 15 10 *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual data refresh'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-census-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Pull fresh Census data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python update_census_data.py

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Census Data Bot"
          git add data/clean/westminster_poverty.csv
          git add data/clean/westminster_insurance.csv
          git add data/clean/westminster_age_65plus.csv
          git add data/clean/westminster_population.csv
          git add data/clean/westminster_language.csv
          git add data/clean/westminster_race.csv
          git add data/clean/westminster_demographics_by_district.csv

          if git diff --staged --quiet; then
            echo "No data changes — Census data is already current."
          else
            git commit -m "Auto-update: Census ACS 5-Year data refresh $(date +'%Y-%m-%d')"
            git push
            echo "Data updated and pushed successfully."
          fi

      - name: Log completion
        run: |
          echo "✓ Census data update complete"
          echo "✓ Data files committed to smaddux303/wfd-cra"
          echo "✓ Site: https://smaddux303.github.io/wfd-cra"

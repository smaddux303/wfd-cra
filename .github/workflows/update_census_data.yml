name: Update Census Data

on:
  schedule:
    - cron: '0 9 15 10 *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual data refresh'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-census-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Pull fresh Census data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CO_DATA_API_KEY: ${{ secrets.CO_DATA_API_KEY }}
        run: python update_census_data.py

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Census Data Bot"

          # Add only files that exist
          for f in \
            data/clean/westminster_poverty.csv \
            data/clean/westminster_insurance.csv \
            data/clean/westminster_age_65plus.csv \
            data/clean/westminster_language.csv \
            data/clean/westminster_population.csv \
            data/clean/westminster_race.csv \
            data/clean/westminster_household_size.csv \
            data/clean/westminster_household_number.csv \
            data/clean/westminster_median_age.csv \
            data/clean/westminster_median_income.csv \
            data/clean/westminster_median_home_value.csv \
            data/clean/westminster_insurance_type.csv \
            data/clean/westminster_public_assistance.csv \
            data/clean/westminster_SNAP.csv \
            data/clean/westminster_disabled.csv \
            data/clean/westminster_no_vehicle.csv \
            data/clean/westminster_no_internet.csv \
            data/clean/westminster_benchmarks.csv \
            data/clean/westminster_unemployment.csv \
            data/clean/westminster_businesses.csv \
            data/clean/westminster_demographics_by_district.csv \
            data/clean/westminster_population_projections.csv \
            data/clean/westminster_employment_industry.csv \
            data/clean/westminster_dam_safety.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No data changes — already current."
          else
            git commit -m "Auto-update: Census ACS data refresh $(date +'%Y-%m-%d')"
            git push
            echo "Data updated and pushed successfully."
          fi

      - name: Log completion
        run: |
          echo "✓ Census data update complete"
          echo "✓ All CSVs committed to smaddux303/wfd-cra"
          echo "✓ Site: https://smaddux303.github.io/wfd-cra"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFD Water Infrastructure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', Arial, sans-serif; background: #fff; color: #253646; }

    .map-header {
      background: #253646; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .map-title  { font-size: 14px; font-weight: 700; color: #fff; }
    .map-subtitle { font-size: 11px; color: #63C7C7; font-weight: 500; margin-top: 2px; }

    .map-controls {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .toggle-btn {
      padding: 5px 12px; border-radius: 16px; font-size: 11px; font-weight: 600;
      border: 1.5px solid rgba(255,255,255,.3); color: #fff; cursor: pointer;
      background: rgba(255,255,255,.1); font-family: 'Montserrat', sans-serif;
      transition: all .15s;
    }
    .toggle-btn.active { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.7); }

    #map { width: 100%; height: 560px; }

    .legend {
      background: rgba(255,255,255,.97); border-radius: 6px; padding: 12px 14px;
      font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; color: #253646;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); min-width: 195px;
    }
    .legend-title {
      font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: #555759; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #CFD2D3;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 500; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-sq   { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .legend-divider { border: none; border-top: 1px solid #F4F5F5; margin: 7px 0; }

    .leaflet-popup-content-wrapper {
      border-radius: 8px !important; box-shadow: 0 4px 16px rgba(0,0,0,.15) !important;
      padding: 0 !important; overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; font-family: 'Montserrat', Arial, sans-serif !important; }
    .popup-header { padding: 9px 13px; color: white; }
    .popup-name  { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .popup-type  { font-size: 10px; font-weight: 500; opacity: .85; margin-top: 2px; letter-spacing: .04em; text-transform: uppercase; }
    .popup-body  { padding: 9px 13px; background: white; font-size: 12px; color: #555759; line-height: 1.7; }

    .map-footer {
      background: #F4F5F5; padding: 8px 16px; font-size: 10px; color: #555759; font-weight: 500;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
    }
  </style>
</head>
<body>

<div class="map-header">
  <div>
    <div class="map-title">Water Infrastructure</div>
    <div class="map-subtitle">Westminster Fire Department Service Area — 5,215 hydrants · 13 storage tanks · 11 pressure zones</div>
  </div>
  <div class="map-controls">
    <button class="toggle-btn active" id="btn-hydrants" onclick="toggleLayer('hydrants')">Hydrants</button>
    <button class="toggle-btn active" id="btn-facilities" onclick="toggleLayer('facilities')">Storage Tanks</button>
    <button class="toggle-btn active" id="btn-zones" onclick="toggleLayer('zones')">Pressure Zones</button>
  </div>
</div>

<div id="map"></div>

<div class="map-footer">
  <span>Click any feature for details · Toggle layers using buttons above</span>
  <span>Source: City of Westminster GIS · Westminster Fire Department CRA</span>
</div>

<script>
const RAW = "https://raw.githubusercontent.com/smaddux303/wfd-cra/main";

const map = L.map('map', {
  center: [39.883, -105.058], zoom: 12,
  zoomControl: true, scrollWheelZoom: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// Westminster boundary
fetch(`${RAW}/maps/westminster_boundary.geojson`)
  .then(r => r.json())
  .then(gj => L.geoJSON(gj, {
    style: { color: '#008996', weight: 2, opacity: 0.8, fillOpacity: 0 }
  }).addTo(map)).catch(() => {});

const layers = {};

function toggleLayer(name) {
  const btn = document.getElementById('btn-' + name);
  if (map.hasLayer(layers[name])) {
    map.removeLayer(layers[name]);
    btn.classList.remove('active');
  } else {
    map.addLayer(layers[name]);
    btn.classList.add('active');
  }
}

// ── Pressure Zones ────────────────────────────────────────────
const ZONE_COLORS = [
  '#008996','#FCB61A','#FF671D','#8CC740','#253646',
  '#63C7C7','#FCB61A','#555759','#2d6a9f','#8CC740','#FF671D'
];

fetch(`${RAW}/maps/westminster_pressure_zones.geojson`)
  .then(r => r.json())
  .then(gj => {
    layers['zones'] = L.geoJSON(gj, {
      style: (feat, i) => {
        const idx = parseInt(feat.properties.PRESSUREZONE || '0') % ZONE_COLORS.length;
        return {
          color:       ZONE_COLORS[idx],
          weight:      1.5,
          opacity:     0.7,
          fillColor:   ZONE_COLORS[idx],
          fillOpacity: 0.12
        };
      },
      onEachFeature: (feat, layer) => {
        const z = feat.properties.PRESSUREZONE || '?';
        layer.bindPopup(`
          <div class="popup-header" style="background:#253646">
            <div class="popup-name">Pressure Zone ${z}</div>
            <div class="popup-type">Water Pressure Zone</div>
          </div>
          <div class="popup-body">
            Zone number: ${z}<br>
            Pressure zones define areas of similar water pressure served by the same control infrastructure.
          </div>
        `, { maxWidth: 260 });
      }
    }).addTo(map);
  }).catch(e => console.error('Zones error:', e));

// ── Water Facilities (Storage Tanks) ─────────────────────────
fetch(`${RAW}/maps/westminster_water_facilities.geojson`)
  .then(r => r.json())
  .then(gj => {
    layers['facilities'] = L.geoJSON(gj, {
      pointToLayer: (feat, latlng) => {
        return L.marker(latlng, {
          icon: L.divIcon({
            className: '',
            html: `<div style="
              background:#253646; border:2px solid #fff;
              border-radius:4px; width:14px; height:14px;
              box-shadow:0 1px 4px rgba(0,0,0,.4);
              display:flex; align-items:center; justify-content:center;
            "><div style="width:6px;height:6px;background:#63C7C7;border-radius:1px;"></div></div>`,
            iconSize: [14,14], iconAnchor: [7,7]
          })
        });
      },
      onEachFeature: (feat, layer) => {
        const p = feat.properties;
        layer.bindPopup(`
          <div class="popup-header" style="background:#253646">
            <div class="popup-name">${p.NAME || 'Water Tank'}</div>
            <div class="popup-type">Water Storage Facility</div>
          </div>
          <div class="popup-body">
            Status: ${p.STATUS || 'N/A'}<br>
            Installed: ${p.INSTALLYEAR || 'N/A'}<br>
            Ownership: ${p.OWNERSHIP || 'N/A'}<br>
            ${p.CAPACITYMG ? 'Capacity: ' + p.CAPACITYMG + ' MG' : ''}
          </div>
        `, { maxWidth: 260 });
      }
    }).addTo(map);
  }).catch(e => console.error('Facilities error:', e));

// ── Hydrants ─────────────────────────────────────────────────
function hydrantColor(ownership) {
  if (ownership === 'City of Westminster') return '#008996';
  if (ownership === 'Private')             return '#FCB61A';
  if (ownership === 'Current Construction') return '#888';
  if (ownership === 'Warranty')            return '#8CC740';
  return '#CFD2D3';
}

fetch(`${RAW}/maps/westminster_hydrants.geojson`)
  .then(r => r.json())
  .then(gj => {
    layers['hydrants'] = L.geoJSON(gj, {
      pointToLayer: (feat, latlng) => {
        const color = hydrantColor(feat.properties.OWNERSHIP);
        return L.circleMarker(latlng, {
          radius:      4,
          fillColor:   color,
          color:       '#fff',
          weight:      0.8,
          opacity:     1,
          fillOpacity: 0.85
        });
      },
      onEachFeature: (feat, layer) => {
        const p = feat.properties;
        layer.bindPopup(`
          <div class="popup-header" style="background:#008996">
            <div class="popup-name">Hydrant ${p.HYDRANTID || ''}</div>
            <div class="popup-type">Potable Water Hydrant</div>
          </div>
          <div class="popup-body">
            Status: ${p.STATUS || 'N/A'}<br>
            Ownership: ${p.OWNERSHIP || 'N/A'}<br>
            Maintenance: ${p.MAINTENANCE || 'N/A'}<br>
            Size: ${p.SIZE ? p.SIZE + '"' : 'N/A'}<br>
            Installed: ${p.INSTALLYEAR || 'N/A'}
          </div>
        `, { maxWidth: 260 });
      }
    }).addTo(map);
  }).catch(e => console.error('Hydrants error:', e));

// ── Legend ────────────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">Water Infrastructure</div>
    <div style="font-size:10px;font-weight:600;color:#555759;margin-bottom:4px;">Hydrants</div>
    <div class="legend-item"><div class="legend-dot" style="background:#008996;"></div>City of Westminster (4,871)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FCB61A;"></div>Private (188)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8CC740;"></div>Warranty (19)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#888;"></div>Construction (136)</div>
    <hr class="legend-divider">
    <div class="legend-item">
      <div style="background:#253646;border:2px solid #fff;border-radius:4px;width:14px;height:14px;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <div style="width:6px;height:6px;background:#63C7C7;border-radius:1px;"></div>
      </div>
      Water Storage Tank
    </div>
    <hr class="legend-divider">
    <div class="legend-item"><div style="width:12px;height:3px;background:#008996;border-radius:2px;flex-shrink:0;"></div>Westminster boundary</div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
